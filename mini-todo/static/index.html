<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Minha Lista de Tarefas</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="card">
    <h1>📝 Minha Lista de Tarefas</h1>

    <form id="form-tarefa">

    <ul id="lista-tarefas"></ul>
  </div>

  <script src="script.js"></script>
</body>
</html>
